name: twela
description: A smart expense tracking app in LYD
publish_to: 'none'
version: 2.0.1+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.1
  home_widget: ^0.4.1
  intl: ^0.20.2
  uuid: ^4.2.1
  fl_chart: ^0.66.0
  http: ^1.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.2.4
  dio: ^5.4.0
  path_provider: ^2.1.2
  open_filex: ^4.3.4
  file_picker: ^13.3.3
  share_plus: ^13.0.0
  permission_handler: ^11.0.1
  device_info_plus: ^13.1.0
  flutter_secure_storage: ^10.3.4
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_source.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
          weight: 400
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700
