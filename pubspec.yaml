name: twela
description: A smart expense tracking app in LYD
publish_to: 'none'
version: 1.1.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.1
  home_widget: ^0.4.1
  intl: ^0.19.0
  uuid: ^4.2.1
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.2.4
  dio: ^5.4.0
  path_provider: ^2.1.2
  open_filex: ^4.3.4
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  device_info_plus: ^10.1.0
  geolocator: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_source.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
